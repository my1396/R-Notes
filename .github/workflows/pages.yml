name: Deploy docs to GitHub Pages

on:
  # Publish whenever the built site changes on main
  push:
    branches: [main]
    paths:
      - "docs/**"
  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

# Grant the token the permissions needed to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel superseded queued runs
# so a burst of pushes can never jam the deployment queue.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built site (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
